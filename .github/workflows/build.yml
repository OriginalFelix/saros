# Has to be the same name as in build_doc in order to require the same check in GitHub
name: Build

on:
  push:
    branches:
    - 'master'
    paths-ignore:
    - 'docs/**'
  pull_request:
    paths-ignore:
    - 'docs/**'

jobs:

  formatter:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - uses: m273d15/java-format-action@v1.1
      with:
        version: '1.6'

  build:
    runs-on: ubuntu-latest

    steps:
    # Pre-Build
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # IntelliJ 2026.3 runs on Java 25
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Determine short sha
      run: echo "SHORT_SHA=$(git rev-parse --short=10 $GITHUB_SHA)" >> $GITHUB_ENV
      shell: 'bash'

    # Build
    - name: Build and test with Gradle
      run: |
        ./gradlew \
          -PskipTestSuites=true \
          -PversionQualifier=DEV-$SHORT_SHA \
          --no-daemon \
          sarosIntellij

    # Post-Build
    - name: Upload intellij build
      uses: actions/upload-artifact@v4
      if: success() && github.ref == 'refs/heads/master'
      with:
        name: saros-intellij-dev-${{ env.SHORT_SHA }}
        path: build/distribution/intellij

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ github.sha }}
        path: |
          core/build/reports/tests
          intellij/build/reports/tests
        if-no-files-found: ignore
