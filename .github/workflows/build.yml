# Has to be the same name as in build_doc in order to require the same check in GitHub
name: Build

on:
  workflow_dispatch:
  push:
    branches:
    - 'master'
    paths-ignore:
    - 'docs/**'
  pull_request:
    paths-ignore:
    - 'docs/**'

jobs:

  formatter:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    # google-java-format 1.6 defines the code style; the all-deps jar bundles its own javac
    - name: Check formatting
      run: |
        curl -sSfL -o "$RUNNER_TEMP/gjf.jar" \
          https://repo1.maven.org/maven2/com/google/googlejavaformat/google-java-format/1.6/google-java-format-1.6-all-deps.jar
        echo "73faf7c9b95bffd72933fa24f23760a6b1d18499151cb39a81cda591ceb7a5f4  $RUNNER_TEMP/gjf.jar" | sha256sum -c -
        unformatted=$(git ls-files -z '*.java' | xargs -0 java -jar "$RUNNER_TEMP/gjf.jar" --dry-run)
        if [ -n "$unformatted" ]; then
          echo "::error::Files not formatted with google-java-format 1.6:"
          echo "$unformatted"
          exit 1
        fi
      shell: 'bash'

  build:
    runs-on: ubuntu-latest

    steps:
    # Pre-Build
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # IntelliJ 2026.3 runs on Java 25
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Determine short sha
      run: echo "SHORT_SHA=$(git rev-parse --short=10 $GITHUB_SHA)" >> $GITHUB_ENV
      shell: 'bash'

    # Build
    - name: Build and test with Gradle
      run: |
        ./gradlew \
          -PskipTestSuites=true \
          -PversionQualifier=DEV-$SHORT_SHA \
          --no-daemon \
          sarosIntellij

    # Post-Build
    # upload-artifact zips the folder itself, so unpack the plugin zip to avoid a zip inside a zip;
    # the downloaded artifact then installs directly via "Install Plugin from Disk"
    - name: Unpack plugin for upload
      if: success() && github.ref == 'refs/heads/master'
      run: unzip -q build/distribution/intellij/*.zip -d build/plugin-upload
      shell: 'bash'

    - name: Upload intellij build
      uses: actions/upload-artifact@v4
      if: success() && github.ref == 'refs/heads/master'
      with:
        name: saros-intellij-dev-${{ env.SHORT_SHA }}
        path: build/plugin-upload

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ github.sha }}
        path: |
          core/build/reports/tests
          intellij/build/reports/tests
        if-no-files-found: ignore
